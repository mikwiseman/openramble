  <g id="text_36">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(23.04 509.461758)">Mac Mini M4, 16 ГиБ · одна Parakeet v3 Q8, Metal · четыре фиксированных публичных составных входа FLEURS, исходная громкость.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(23.04 525.211758)">Одна обработка каждой пары. Оба порога используют исправленный отсчёт сегментов; сохранение всего тихого аудио выключено.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(23.04 540.779648)">Подача ускорена с ожиданием очереди. Эта проверка локализует потери и не представляет все реальные микрофоны, комнаты и встречи.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(23.04 556.711758)">Глобальное снижение порога отклонено из-за эха. Отдельный порог системного канала прошёл новые проверки; он показан на графике второй отложенной выборки.</text>
  </g>
