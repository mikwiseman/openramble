    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25262e" x="701.44" y="111.6" transform="rotate(-0 701.44 111.6)">Суммарное декодирование, с</text>
   </g>
  </g>
  <g id="text_38">
   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25262e" x="23.04" y="32.7725" transform="rotate(-0 23.04 32.7725)">Шум: лишние слова и работа модели</text>
  </g>
  <g id="text_39">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(23.04 579.661758)">Mac Mini M4, 16 ГиБ · одна Parakeet v3 Q8, Metal · пять синтетических входов по 20 секунд, одна обработка при каждом пороге.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(23.04 595.411758)">Пустая эталонная фраза: считаются выданные слова, WER не вычисляется. Нулевой текст не означает нулевую вычислительную работу.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(23.04 611.161758)">Загрузка и прогрев исключены из времени декодирования. Число вызовов, максимум одного вызова и хеши PCM сохранены в таблицах.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(23.04 626.821523)">Для принятия кандидата все пять входов должны дать ноль слов, а отдельный вызов модели не должен превысить две секунды.</text>
  </g>
