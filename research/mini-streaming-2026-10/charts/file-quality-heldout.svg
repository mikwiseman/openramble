   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25262e" x="24.48" y="30.516094" transform="rotate(-0 24.48 30.516094)">Новые фразы подтвердили улучшение качества</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 487.862344)">Mac Mini M4, 16 ГиБ · одна Parakeet v3 Q8, Metal · 50 новых разных фраз RU и 50 EN, повторённых в трёх файлах около 59 минут.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 503.701758)">18 нативных запусков: три языка × два предела фрагмента × три повтора. Повторы не увеличивают разнообразие речевых примеров.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 519.269648)">Слева: 30 с с исходным стыком → 15 с с сохранением слов через разрыв. Правило стыка рассчитано по тем же нативным словам.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 535.201758)">Справа: время нативной нарезки 30 с → 15 с с исходным стыком в обоих случаях. Полный вариант отдельно проверен в FileTranscriber.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 550.951758)">Настройки выбраны до открытия этих фраз. Ошибок стало меньше во всех трёх наборах, но смешанная речь всё ещё содержит много ошибок.</text>
  </g>
