   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25262e" x="18.72" y="29.107813" transform="rotate(-0 18.72 29.107813)">Скорость и качество на тех же длинных файлах</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(18.72 512.252344)">Mac Mini M4, 16 ГиБ · OpenRamble 0.32.0 · Parakeet v3 Q8, Metal · три составных файла около 59 минут.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(18.72 528.091758)">Подпись: язык и число моделей. Основная серия 9 октября: медиана трёх повторов с одной и двумя моделями.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(18.72 543.751523)">Без загрузки модели. WER на фиксированном входе. Сравнивать число моделей можно внутри одного цвета. Языковые файлы содержат разные исходные фразы.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(18.72 559.591758)">В основной серии четыре модели прерваны при загрузке. Дополнительная диагностика 11 октября показана отдельно.</text>
  </g>
