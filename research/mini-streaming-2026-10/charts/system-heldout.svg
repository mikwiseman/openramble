  <g id="text_27">
   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25262e" x="24.48" y="30.637187" transform="rotate(-0 24.48 30.637187)">Тихий системный звук: проверка на новых фразах</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 487.951758)">Mac Mini M4, 16 ГиБ · одна Parakeet v3 Q8, Metal · второй отложенный набор, без пересечения с 300 предыдущими записями.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 503.611523)">50 RU и 50 EN фраз использованы по одному разу с паузами 0,5 с. Четыре запуска, один на язык и настройку.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 519.451758)">Меняется только системный канал; микрофон остаётся на 0,02. Проверки захвата и эха пройдены отдельно до открытия выборки.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 535.201758)">Порог выбран заранее, без подгонки по этим результатам. Стенд подаёт подготовленное аудио; реальные устройства и звонки здесь не измерены.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5d606b" transform="translate(24.48 550.861523)">Все заранее заданные условия пройдены; изменение внедрено в ветке PR, ещё не выпущено.</text>
  </g>
