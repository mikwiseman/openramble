<title>OpenRamble Model Bench</title>
<style>
/* Layout: one centred column in OpenRamble's own language. Air groups, a
   hairline separates rows, and anything a person or a model said is set in
   the serif. One meaning per colour: green passed, orange needs attention,
   and a filled mark is "with his instructions". */
:root {
  --paper: #fbfbfd;
  --ink: #1d1d1f;
  --muted: #6e6e76;
  --hairline: rgba(29, 29, 31, 0.12);
  --tile: rgba(29, 29, 31, 0.045);
  --good: #1f9d47;
  --attention: #d9730b;
  --words: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --app: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --figures: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --column: 43rem;
  --surface: 24px;
  --control: 10px;
  --chip: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111114; --ink: #f2f2f5; --muted: #9a9aa3; --hairline: rgba(242, 242, 245, 0.15);
    --tile: rgba(242, 242, 245, 0.07); --good: #36c964; --attention: #ff9f2e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111114; --ink: #f2f2f5; --muted: #9a9aa3; --hairline: rgba(242, 242, 245, 0.15);
  --tile: rgba(242, 242, 245, 0.07); --good: #36c964; --attention: #ff9f2e; color-scheme: dark;
}

body {
  background: var(--paper);
  color: var(--ink);
  font: 400 1rem/1.5 var(--app);
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: var(--column);
  margin: 0 auto;
  padding-block: 4.5rem 6rem;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 6rem;
}
section, header, footer { display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }

/* Type */
h1, h2, h3, p, blockquote, figure { margin: 0; }
h1 { font: 400 clamp(2.6rem, 9vw, 4.25rem)/1.02 var(--words); letter-spacing: -0.02em; text-wrap: balance; }
h2 { font: 400 clamp(2rem, 6vw, 2.75rem)/1.08 var(--words); letter-spacing: -0.015em; }
h3 { font: 500 1.0625rem/1.3 var(--app); }
.label { font: 500 0.75rem/1.3 var(--app); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 1.1875rem; line-height: 1.45; max-width: 34rem; color: var(--ink); }
.note { color: var(--muted); font-size: 0.9375rem; max-width: 36rem; }
.words { font-family: var(--words); }
.num { font-family: var(--figures); font-variant-numeric: tabular-nums; font-size: 0.875em; letter-spacing: -0.01em; }
.dim { color: var(--muted); }
.intro { display: flex; flex-direction: column; gap: 0.75rem; }

/* Rows: air and a hairline, never a box. */
.rows { display: flex; flex-direction: column; }
.row { display: grid; align-items: center; gap: 0.25rem 1rem; padding: 0.8rem 0; border-top: 1px solid var(--hairline); min-width: 0; }
.rows > .row:last-child { border-bottom: 1px solid var(--hairline); }
.row.head { border-top: 0; padding: 0 0 0.5rem; }
.model { font-weight: 500; white-space: nowrap; display: flex; flex-direction: column; line-height: 1.25; }
.model small { font: 400 0.8125rem/1.3 var(--app); color: var(--muted); }
.right { text-align: right; }

/* Scoreboard */
.board .row { grid-template-columns: minmax(8.5rem, 1.3fr) 5.5rem repeat(3, minmax(4.5rem, 1fr)); }
.marks { display: flex; gap: 5px; align-items: center; }
.mark { width: 11px; height: 11px; border-radius: 50%; background: var(--good); }
.mark.fail, .mark.partial { background: var(--attention); }
.mark.partial { background: transparent; box-shadow: inset 0 0 0 2px var(--attention); }
.mark.void, .mark.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--hairline); }
.arrow { color: var(--muted); padding: 0 0.15em; }

/* A task */
.task { display: flex; flex-direction: column; gap: 1.1rem; }
.task + .task { margin-top: 3.5rem; }
blockquote.words { font-size: clamp(1.25rem, 3.6vw, 1.5rem); line-height: 1.38; text-wrap: pretty; }
blockquote.words p + p { margin-top: 0.6em; }
blockquote.words ul { margin: 0.5em 0; padding-left: 1.1em; font-size: 0.85em; }
blockquote.words code { font: 0.78em var(--figures); overflow-wrap: anywhere; }
.shipped { display: flex; flex-wrap: wrap; gap: 0.3rem 1.25rem; color: var(--muted); font-size: 0.9375rem; }
.runs .row { grid-template-columns: minmax(8.5rem, 1.3fr) 4.25rem minmax(6rem, 2.2fr) 3.5rem 3.75rem; }
.state { font-weight: 500; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 0.4rem; color: var(--good); }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.state.fail, .state.partial { color: var(--attention); }
.state.void { color: var(--muted); }
.size { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
.track { position: relative; flex: 1; height: 8px; min-width: 2rem; }
.track::before { content: ""; position: absolute; inset: 3.5px 0; background: var(--hairline); border-radius: 1px; }
.bar { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--good); border-radius: 1px; }
.why { grid-column: 1 / -1; color: var(--attention); font-size: 0.875rem; }
.unit { display: none; color: var(--muted); font: 400 0.8125rem var(--app); }
details { border-top: 0; }
summary { cursor: pointer; color: var(--muted); font-size: 0.9375rem; width: fit-content; padding: 0.25rem 0; border-radius: var(--chip); }
summary:hover { color: var(--ink); }
summary:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.said { display: flex; flex-direction: column; gap: 1.1rem; padding: 1rem 0 0; }
.said p.words { font-size: 1.0625rem; line-height: 1.45; }
.said .who { font: 500 0.8125rem var(--app); color: var(--muted); display: block; margin-bottom: 0.15rem; }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; color: var(--muted); font-size: 0.875rem; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); flex: none; }
.dot.open { background: var(--paper); box-shadow: inset 0 0 0 1.75px var(--ink); }
.key-tick { width: 2px; height: 14px; background: var(--good); border-radius: 1px; }

/* Words per answer */
.chart { display: flex; flex-direction: column; gap: 1.25rem; }
.chart + .chart { margin-top: 3.5rem; }
.situation { display: grid; grid-template-columns: minmax(7.5rem, 11rem) 1fr; gap: 0.15rem 1rem; align-items: center; padding: 0.7rem 0; border-top: 1px solid var(--hairline); }
.situation > h3 { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 1rem; font-size: 0.9375rem; padding-bottom: 0.2rem; }
.situation .name { color: var(--muted); font-size: 0.875rem; }
.span { position: relative; height: 18px; }
.span::before { content: ""; position: absolute; inset: 8.5px 0; background: var(--hairline); }
.span .link { position: absolute; top: 8px; height: 2px; background: var(--ink); opacity: 0.55; }
.span .dot { position: absolute; top: 4px; margin-left: -5px; }
.span .tick { top: 1px; bottom: 1px; margin-left: -1px; }
.axis { display: grid; grid-template-columns: minmax(7.5rem, 11rem) 1fr; gap: 1rem; color: var(--muted); }
.axis div { position: relative; height: 1.1rem; }
.axis div span { position: absolute; transform: translateX(-50%); }
.axis div span:first-child { transform: none; }
.axis div span:last-child { transform: translateX(-100%); }

/* One question, twenty times */
.question { font-size: clamp(1.5rem, 5vw, 2.125rem); line-height: 1.2; text-wrap: balance; }
.twenty .row { grid-template-columns: minmax(6.5rem, 1fr) 4.75rem auto 3.25rem; }
.answers { display: flex; flex-wrap: wrap; gap: 4px; }
.answers button { all: unset; width: 13px; height: 13px; border-radius: 50%; cursor: pointer; background: var(--paper); box-shadow: inset 0 0 0 1.75px var(--ink); }
.answers button.yes { background: var(--ink); }
.answers button[aria-pressed="true"] { outline: 2px solid var(--attention); outline-offset: 2px; }
.answers button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.reading { background: var(--tile); border-radius: var(--surface); padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.4rem; min-height: 7.5rem; }
.reading p.words { font-size: 1.125rem; line-height: 1.42; }

/* Bars for shares and pairs */
.pairs .row { grid-template-columns: minmax(8.5rem, 1.1fr) 1fr 1fr; }
.share .row { grid-template-columns: minmax(8.5rem, 1.1fr) 1fr 1fr; }
.meter { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
.meter .track { height: 10px; }
.meter .track::before { inset: 4.5px 0; }
.meter .bar.open { background: var(--paper); box-shadow: inset 0 0 0 1.75px var(--ink); }
.meter .num { min-width: 2.6rem; }

footer { gap: 0.9rem; color: var(--muted); font-size: 0.9375rem; }
footer code { font: 0.875rem var(--figures); color: var(--ink); background: var(--tile); padding: 0.55rem 0.8rem; border-radius: var(--control); width: fit-content; max-width: 100%; overflow-x: auto; white-space: nowrap; }

@media (max-width: 40rem) {
  .page { gap: 4.5rem; padding-block: 3rem 4rem; }
  .board .row { grid-template-columns: 1fr auto; }
  .board .row > :nth-child(n + 3) { grid-column: 1 / -1; display: flex; justify-content: space-between; text-align: left; }
  .board .row > :nth-child(n + 3)::before { content: attr(data-label); color: var(--muted); font: 400 0.875rem var(--app); letter-spacing: 0; }
  .board .row.head { display: none; }
  .runs .row { grid-template-columns: 1fr auto auto auto; column-gap: 0.9rem; }
  .runs .row .size { grid-column: 1 / -1; grid-row: 2; }
  .runs .row .why { grid-row: 3; }
  .runs .row.head { display: none; }
  .unit { display: inline; }
  .twenty .row { grid-template-columns: 1fr auto; }
  .twenty .row .answers { grid-column: 1 / -1; }
  .twenty .row .cond { grid-column: 1; grid-row: 2; }
  .twenty .row .answers { grid-row: 3; }
  .twenty .row .count { grid-row: 1; grid-column: 2; }
  .pairs .row, .share .row { grid-template-columns: 1fr; }
  .pairs .row.head, .share .row.head { display: none; }
  .pairs .meter::before, .share .meter::before { content: attr(data-label); color: var(--muted); font-size: 0.8125rem; min-width: 7.5rem; }
  .situation, .axis { grid-template-columns: 5.25rem 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar, .answers button { transition: background-color 120ms; }
}

const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
};

// What a person or a model said keeps its line breaks and inline code, and nothing else.

  for (const block of text.split(/\n\s*\n/)) {

    const inline = (line, el) => {
      line.split(/(`[^`]+`)/).forEach((part) => el.append(part.startsWith("`") ? h("code", { text: part.slice(1, -1) }) : part.replace(/\*\*/g, "")));
      return el;

    if (lines.every((l) => l.startsWith("- "))) {
      list = h("ul", {}, lines.map((l) => inline(l.slice(2), h("li"))));
      out.push(list);
    } else out.push(inline(lines.join(" "), h("p")));
  }
  return out;
};
