<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>OpenRamble Model Bench</title>
<style>
/* Layout: what was needed stands on the left, and what each model made stands
   beside it at true size. An answer is drawn as its own words and a change as
   its own lines. OpenRamble's language: air, a hairline, words in the serif. */
:root {
  --paper: #fbfbfd;
  --ink: #1d1d1f;
  --soft: rgba(29, 29, 31, 0.5);
  --wall: rgba(29, 29, 31, 0.7);
  --faint: rgba(29, 29, 31, 0.26);
  --hairline: rgba(29, 29, 31, 0.12);
  --tile: rgba(29, 29, 31, 0.05);
  --good: #1f9d47;
  --attention: #d9730b;
  --words: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --app: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111114; --ink: #f2f2f5; --soft: rgba(242, 242, 245, 0.55); --wall: rgba(242, 242, 245, 0.72); --faint: rgba(242, 242, 245, 0.3);
    --hairline: rgba(242, 242, 245, 0.15); --tile: rgba(242, 242, 245, 0.08); --good: #36c964; --attention: #ff9f2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111114; --ink: #f2f2f5; --soft: rgba(242, 242, 245, 0.55); --wall: rgba(242, 242, 245, 0.72); --faint: rgba(242, 242, 245, 0.3);
  --hairline: rgba(242, 242, 245, 0.15); --tile: rgba(242, 242, 245, 0.08); --good: #36c964; --attention: #ff9f2e;
  color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font: 400 1rem/1.45 var(--app); -webkit-font-smoothing: antialiased; }
.page {
  max-width: 66rem; margin: 0 auto; padding-block: 4rem 5rem;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 7.5rem;
}
h1, h2, p, blockquote { margin: 0; }
h1 { font: 400 clamp(2.4rem, 7.2vw, 4.5rem)/1.03 var(--words); letter-spacing: -0.02em; text-wrap: balance; max-width: 14em; }
h2 { font: 400 clamp(2rem, 5vw, 3rem)/1.05 var(--words); letter-spacing: -0.015em; }
.label { font: 500 0.75rem/1.3 var(--app); letter-spacing: 0.07em; text-transform: uppercase; color: var(--soft); }
.quiet { color: var(--soft); font-size: 0.875rem; }
.figure { font: 400 1em/1 var(--words); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
header, section { display: flex; flex-direction: column; gap: 2.25rem; min-width: 0; }

/* The board: three figures a model */
.board { display: grid; grid-template-columns: minmax(7rem, 1.5fr) repeat(3, minmax(0, 1fr)); }
.board > * { padding: 1.1rem 0; border-top: 1px solid var(--hairline); display: flex; flex-direction: column; justify-content: center; }
.board > .top { border-top: 0; padding: 0 0 0.7rem; justify-content: flex-end; }
.board .n { align-items: flex-end; text-align: right; }
.board .figure { font-size: clamp(1.6rem, 5.4vw, 2.75rem); }
.board .name { font-weight: 500; font-size: 1.0625rem; }
.board small, .top small { font: 400 0.8125rem/1.3 var(--app); color: var(--soft); letter-spacing: 0; text-transform: none; }

/* A section's controls */
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 1rem 2rem; }
.tabs { display: flex; gap: 0.25rem 1.5rem; flex-wrap: wrap; }
.tabs button, .steps button { all: unset; cursor: pointer; color: var(--soft); font-size: 0.9375rem; padding: 0.3rem 0; border-bottom: 1.5px solid transparent; }
.tabs button:hover, .steps button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"], .steps button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.steps { display: inline-flex; gap: 0.9rem; margin-left: 1rem; vertical-align: 0.35em; }
.steps button { font: 400 0.875rem var(--app); padding: 0 0.15rem 0.1rem; }
button:focus-visible, .wall:focus-visible, .map:focus-visible, .switch input:focus-visible + i { outline: 2px solid var(--ink); outline-offset: 3px; }
.ask { font: 400 clamp(1.4rem, 3.6vw, 2.125rem)/1.25 var(--words); max-width: 26em; text-wrap: pretty; }
.ask p + p { margin-top: 0.55em; }
.ask ul { margin: 0.5em 0; padding-left: 1.1em; font-size: 0.8em; }
.ask code { font: 0.74em ui-monospace, "SF Mono", Menlo, monospace; overflow-wrap: anywhere; }

.switch { display: inline-flex; align-items: center; gap: 0.6rem; cursor: pointer; font-size: 0.9375rem; user-select: none; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch i { width: 40px; height: 24px; border-radius: 12px; background: var(--faint); position: relative; transition: background-color 150ms; flex: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); transition: transform 150ms; }
.switch input:checked + i { background: var(--good); }
.switch input:checked + i::after { transform: translateX(16px); }

/* The stage: five columns hang from one line */
.stage { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 clamp(0.5rem, 2.4vw, 2rem); align-items: start; border-top: 1px solid var(--hairline); padding-top: 1.1rem; }
.col { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.col .who { font: 500 clamp(0.6875rem, 1.9vw, 0.9375rem)/1.25 var(--app); min-height: 2.5em; }
.col .figure { font-size: clamp(1.5rem, 5.6vw, 3.25rem); }
.col .facts { font: 400 clamp(0.625rem, 1.7vw, 0.8125rem)/1.35 var(--app); color: var(--soft); min-height: 2.9em; margin-bottom: 0.9rem; }
.replay .col .facts { min-height: 4.3em; }
.col .facts b { font-weight: 400; display: block; }
.col .facts .bad { color: var(--attention); }
.pass { color: var(--good); }
.fail { color: var(--attention); }

.wall { cursor: pointer; overflow: hidden; border-radius: 3px; }
.wall > div { transform-origin: 0 0; font: 400 16px/1.32 var(--words); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--wall); }
.col.needed .wall > div { color: var(--ink); }
.wall:hover > div { color: var(--ink); }
.map { display: flex; flex-direction: column; gap: 5px; cursor: pointer; border-radius: 3px; }
.map.still { cursor: default; }
.map i { display: block; height: 1px; margin-bottom: 1px; background: var(--ink); }
.map .tests i { background: var(--faint); }
.key { display: flex; gap: 1.25rem; align-items: center; }
.key span { display: inline-flex; align-items: center; gap: 0.45rem; }
.key i { width: 18px; height: 2px; background: var(--ink); }
.key i.light { background: var(--faint); }

dialog { border: 0; padding: 0; background: var(--paper); color: var(--ink); border-radius: 24px; max-width: min(42rem, calc(100vw - 2rem)); max-height: min(85vh, 48rem); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28); }
dialog::backdrop { background: rgba(0, 0, 0, 0.42); }
dialog article { padding: 1.75rem 2rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
dialog .said { font: 400 1.125rem/1.5 var(--words); white-space: pre-wrap; overflow-wrap: anywhere; }
dialog header { flex-direction: row; justify-content: space-between; align-items: baseline; gap: 1rem; }
dialog button { all: unset; cursor: pointer; color: var(--soft); font-size: 0.9375rem; padding: 0.2rem 0.4rem; border-radius: 7px; }
dialog button:hover { color: var(--ink); }

footer { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: center; justify-content: space-between; }
footer code { font: 0.8125rem ui-monospace, "SF Mono", Menlo, monospace; background: var(--tile); padding: 0.5rem 0.75rem; border-radius: 10px; max-width: 100%; overflow-x: auto; white-space: nowrap; }

@media (max-width: 44rem) {
  .page { gap: 5rem; padding-block: 2.5rem 3.5rem; }
  .board { grid-template-columns: minmax(5.5rem, 1.3fr) repeat(3, minmax(0, 1fr)); }
  .board .name { font-size: 0.9375rem; }
  .board small { font-size: 0.6875rem; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -20px; padding-right: 20px; width: 100%; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { white-space: nowrap; }
}
@media (prefers-reduced-motion: reduce) { .switch i, .switch i::after { transition: none; } }
</style>

<div class="page" id="page"></div>
<dialog id="reader"><article><header><span class="label" id="reader-who"></span><button type="button" id="reader-close">Close</button></header><div class="said" id="reader-text"></div></article></dialog>

<script>
// In a function, so that its names cannot collide with the window's own (top, name).
(() => {
const DATA = /*DATA*/null;

const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
};
const times = (x) => (x === null || x === undefined ? "–" : (x >= 9.95 ? Math.round(x) : x.toFixed(1)) + "×");
const money = (v) => (v === null ? null : v < 10 ? "$" + v.toFixed(2) : "$" + Math.round(v));
const plain = (text) => text.replace(/^```\w*\n?|```\s*$/gm, "").replace(/\*\*|`/g, "").replace(/^#+ /gm, "").trim();
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

// What Mik said keeps its paragraphs, its lists and its inline code.
const said = (text) => text.split(/\n\s*\n/).map((block) => {
  const lines = block.split("\n");
  const inline = (line, el) => { line.split(/(`[^`]+`)/).forEach((part) => el.append(part.startsWith("`") ? h("code", { text: part.slice(1, -1) }) : part)); return el; };
  return lines.every((l) => l.startsWith("- ")) ? h("ul", {}, lines.map((l) => inline(l.slice(2), h("li")))) : inline(lines.join(" "), h("p"));
});

const reader = document.getElementById("reader");
document.getElementById("reader-close").addEventListener("click", () => reader.close());
reader.addEventListener("click", (e) => { if (e.target === reader) reader.close(); });
const read = (who, text) => {
  document.getElementById("reader-who").textContent = who;
  document.getElementById("reader-text").textContent = plain(text);
  reader.showModal();
};
const opens = (el, who, text) => {
  el.setAttribute("role", "button"); el.setAttribute("tabindex", "0"); el.setAttribute("aria-label", "Read: " + who);
  el.addEventListener("click", () => read(who, text));
  el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); read(who, text); } });
  return el;
};

const page = document.getElementById("page");
const column = (cls, who, figure, facts, body) => h("div", { class: "col " + cls },
  h("div", { class: "who" }, who), h("div", { class: "figure", text: figure }), h("div", { class: "facts" }, facts), body);
const tabs = (names, current, pick) => h("div", { class: "tabs" }, names.map((n, i) =>
  h("button", { type: "button", "aria-pressed": String(i === current), text: n, onclick: () => pick(i) })));

// --- The answer to the page's question
page.append(h("header", {},
  h("p", { class: "label", text: "OpenRamble model bench" }),
  h("h1", { text: "Which model should change OpenRamble?" }),
  h("div", { class: "board" },
    h("div", { class: "top" }),
    h("div", { class: "top n label" }, "Passed"),
    h("div", { class: "top n label" }, "Code", h("small", { text: "× what shipped" })),
    h("div", { class: "top n label" }, "Words", h("small", { text: "× what was needed" })),
    DATA.models.map((m) => { const b = DATA.board[m.key]; return [
      h("div", {}, h("span", { class: "name", text: m.name }), h("small", { text: m.tool })),
      h("div", { class: "n" }, h("span", { class: "figure", text: b.passed[0] + "/" + b.passed[1] })),
      h("div", { class: "n" }, h("span", { class: "figure", text: times(b.code) })),
      h("div", { class: "n" }, h("span", { class: "figure", text: times(b.words) }))]; })),
  h("p", { class: "quiet", text: `Pilot of ${DATA.date}. One run per task, so a first look and not a ranking.` })));

// --- Replay: the same request, and every change at its own length
const replay = h("section", { class: "replay" });
let task = 0;
const drawMap = (files, who, report) => {
  const map = h("div", { class: "map" + (report ? "" : " still") }, files.map((f) => h("div", { class: f.kind },
    f.lines.map(([indent, length]) => h("i", { style: `margin-left:${indent}%;width:${Math.max(length, 2)}%` })))));
  return report ? opens(map, who, report) : map;
};
const showTask = () => {
  const t = DATA.replay[task];
  replay.replaceChildren(
    h("div", { class: "head" }, h("h2", { text: "Replay" }), tabs(DATA.replay.map((x) => x.title), task, (i) => { task = i; showTask(); })),
    h("blockquote", { class: "ask" }, said(t.request)),
    h("div", { class: "stage" },
      column("needed", "Shipped", String(t.shipped.source), [h("b", { text: t.shipped.source === 1 ? "line of code" : "lines of code" }), t.note && h("b", { text: t.note })], drawMap(t.shipped.files, "", null)),
      DATA.models.map((m) => {
        const r = t.runs[m.key];
        if (!r) return column("", m.name, "–", [h("b", { text: "not run yet" })], null);
        if (r.state === "void") return column("", m.name, "–", [h("b", { text: "no result" })], null);
        const mark = h("span", { class: r.state === "pass" ? "pass" : "fail", text: { pass: " ✓", partial: " ?" }[r.state] || " ✗" });
        const figure = t.shipped.source ? times(r.source / t.shipped.source) : String(r.source);
        return column("", [m.name, mark], figure, [
          h("b", { text: t.shipped.source ? `${r.source} lines` : (r.source === 1 ? "line of code" : "lines of code") }),
          r.state === "pass" ? null : h("b", { class: "bad", text: r.reason === "hidden tests" ? "failed the real tests" : r.reason }),
          h("b", { text: r.minutes.toFixed(1) + " min" }), money(r.cost) && h("b", { text: money(r.cost) })],
          drawMap(r.files, `${m.name}, its report`, r.report));
      })),
    h("p", { class: "quiet key" }, h("span", {}, h("i"), "code"), h("span", {}, h("i", { class: "light" }), "tests")));
};
showTask();
page.append(replay);

// --- Slop: the same job, and every answer at its own length
const slop = h("section", {});
let job = 0, told = true;
const kinds = [...new Set(DATA.slop.map((j) => j.situation))];
const scale = () => (innerWidth < 704 ? 230 : 300);
const drawWall = (text, who) => {
  const inner = h("div", { text: plain(text) });
  const wall = opens(h("div", { class: "wall" }, inner), who, text);
  wall.fit = () => {
    const z = wall.clientWidth / scale();
    inner.style.width = scale() + "px"; inner.style.transform = `scale(${z})`;
    wall.style.height = Math.ceil(inner.offsetHeight * z) + "px";
    return Math.ceil(inner.offsetHeight * z);
  };
  return wall;
};
const showJob = (animate) => {
  const j = DATA.slop[job], before = animate ? [...slop.querySelectorAll(".col")].map((c) => { const w = c.querySelector(".wall"); return w ? w.offsetHeight : 0; }) : [];
  const same = DATA.slop.map((x, i) => [x, i]).filter(([x]) => x.situation === j.situation);
  const walls = [];
  const stage = h("div", { class: "stage" },
    column("needed", j.label, String(j.needed.words), [h("b", { text: "words" })], walls[0] = drawWall(j.needed.text, j.label)),
    DATA.models.map((m, i) => {
      const a = j.answers[m.key] && j.answers[m.key][told ? "instructed" : "plain"];
      if (!a) return column("", m.name, "–", [h("b", { text: "no answer" })], null);
      return column("", m.name, times(a.words / j.needed.words), [h("b", { text: a.words + " words" }),
        a.missing ? h("b", { class: "bad", text: a.missing === 1 ? "1 fact left out" : a.missing + " facts left out" }) : null],
        walls[i + 1] = drawWall(a.text, `${m.name}, ${a.words} words`));
    }));
  slop.replaceChildren(
    h("div", { class: "head" }, h("h2", { text: "Slop" }),
      h("label", { class: "switch" }, h("input", { type: "checkbox", id: "told", checked: told ? "" : null, onchange: (e) => { told = e.target.checked; showJob(true); } }), h("i"), "Mik's instructions")),
    tabs(kinds.map((k) => k[0].toUpperCase() + k.slice(1)), kinds.indexOf(j.situation), (i) => { job = DATA.slop.findIndex((x) => x.situation === kinds[i]); showJob(false); }),
    h("blockquote", { class: "ask" }, j.ask, same.length > 1 ? h("span", { class: "steps" }, same.map(([x, i], n) =>
      h("button", { type: "button", "aria-pressed": String(i === job), "aria-label": `Job ${n + 1} of ${same.length}`, text: String(n + 1), onclick: () => { job = i; showJob(false); } }))) : null),
    stage);
  walls.forEach((w, i) => {
    if (!w) return;
    const to = w.fit();
    if (animate && !calm && before[i] && w.animate) w.animate([{ height: before[i] + "px" }, { height: to + "px" }], { duration: 380, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
};
page.append(slop);
showJob(false);
addEventListener("resize", () => slop.querySelectorAll(".wall").forEach((w) => w.fit && w.fit()));

page.append(h("footer", { class: "quiet" },
  h("span", { text: `Each model ran inside its own tool at ${DATA.effort} effort. Tap any answer or change to read it.` }),
  h("code", { text: "research/model-bench-2026-11/bench pilot" })));
})();
</script>
