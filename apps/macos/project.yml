name: WaiDictation

options:
  bundleIdPrefix: is.waiwai
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  DictationCore:
    path: ../../Packages/DictationCore
  LocalASR:
    path: ../../Packages/LocalASR
  # Обновления. Версия пришпилена точно, а не `from:`: Sparkle приезжает
  # готовым бинарным фреймворком внутрь приложения, и подниматься эта версия
  # должна осознанно, а не сама при следующей сборке.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Песочница выключена намеренно: диктовка обязана вставлять текст в чужие
    # приложения, а из песочницы это невозможно.
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    # Собираем под обе архитектуры: распознавание работает только на Apple
    # Silicon, но приложение должно запускаться и на Intel, чтобы честно
    # сказать об этом пользователю.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
  configs:
    # Отладочная и тестовая сборка идёт только под ту архитектуру, на которой
    # её запускают.
    #
    # Иначе `xcodebuild … -destination 'platform=macOS'` собирает цель
    # приложения под обе архитектуры, а пакеты Xcode при конкретном назначении
    # строит только под одну — и компиляция падает на «Unable to find module
    # dependency: DictationCore» под x86_64. Универсальность нужна релизу, и он
    # её получает: `scripts/build-dmg.sh` собирает с `generic/platform=macOS`,
    # где пакеты строятся под обе.
    Debug:
      ONLY_ACTIVE_ARCH: YES

targets:
  WaiDictation:
    type: application
    platform: macOS
    sources:
      - path: WaiDictation
    dependencies:
      - package: DictationCore
        product: DictationCore
      - package: DictationCore
        product: DictationAudio
      - package: LocalASR
        product: LocalASR
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.waiwai.dictation
        PRODUCT_NAME: Wai Dictation
        INFOPLIST_FILE: WaiDictation/Info.plist
        SWIFT_STRICT_CONCURRENCY: complete
        # Предупреждения — ошибки, как и в пакетах. Раньше это было правдой
        # только для них, а CI утверждал, что для всего проекта: цель
        # приложения собиралась без гейта, и три нарушения изоляции когда-то
        # уже прятались ровно за такой дырой.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: is.waiwai.dictation.dev
    info:
      path: WaiDictation/Info.plist
      properties:
        CFBundleName: Wai Dictation
        CFBundleShortVersionString: "0.1.0"
        # Приложение живёт в строке меню и не показывается в Dock.
        LSUIElement: true
        NSMicrophoneUsageDescription: >-
          Микрофон нужен, чтобы записать вашу речь. Запись обрабатывается
          на этом компьютере и никуда не отправляется.
        NSHumanReadableCopyright: "© 2026 Mik Wiseman. MIT."

        # --- Обновления (Sparkle) ---
        #
        # Где лежит список версий. Обычный статический файл на GitHub Pages,
        # никакого сервера у продукта нет.
        SUFeedURL: https://mikwiseman.github.io/wai-dictation/appcast.xml
        # Автопроверка выключена. Ключ обязателен именно в таком виде: без него
        # Sparkle на втором запуске сам спросит «проверять обновления?» и по
        # умолчанию включит проверки. Продукт обещает «сеть только по вашей
        # команде» — приложение, которое ходит в сеть при старте, это обещание
        # нарушает. Пользователь включает проверки сам, в настройках.
        SUEnableAutomaticChecks: false
        # Не отправлять отчёт о системе (модель Mac, версия ОС, язык, ЦП).
        # Вместе с запросом обновления уходит только IP и версия приложения.
        SUSendProfileInfo: false
        # Фоновая загрузка и установка недоступны даже как опция: обновление
        # ставится тогда, когда человек нажал кнопку, и никак иначе.
        SUAllowsAutomaticUpdates: false
        # Публичный ключ EdDSA, которым проверяется подпись обновления.
        # Появится здесь после `generate_keys` — он публичный, и его место
        # в репозитории. До этого выпустить релиз нельзя: scripts/release.sh
        # откажется работать. Порядок действий — в docs/release.md.
        # SUPublicEDKey: "…"

  # Тесты цели приложения.
  #
  # Собираются БЕЗ приложения-хозяина (`TEST_HOST` не задан), а исходники
  # приложения компилируются прямо в тестовый бандл. Причина не в удобстве:
  # с хозяином `xcodebuild test` пришлось бы запускать само приложение, а оно
  # живёт в строке меню (`LSUIElement`), поднимает таймеры, спрашивает
  # разрешения и на первом запуске открывает окно онбординга. В сессии без
  # графического сеанса такой прогон висит до таймаута вместо того, чтобы
  # упасть с понятной ошибкой. Плюс внедрение бандла в приложение с включённым
  # Hardened Runtime требует отдельного послабления подписи.
  #
  # Плата за это — исходники приложения компилируются дважды. Она заметна
  # только на времени сборки и того стоит.
  WaiDictationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WaiDictationTests
      - path: WaiDictation
        excludes:
          # Точка входа: `@main` в тестовом бандле не нужен и мешает.
          - "WaiDictationApp.swift"
          - "Info.plist"
    dependencies:
      - package: DictationCore
        product: DictationCore
      - package: DictationCore
        product: DictationAudio
      - package: LocalASR
        product: LocalASR
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.waiwai.dictation.tests
        PRODUCT_NAME: WaiDictationTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        # Тестовый бандл грузится в чужой процесс (xctest), поэтому нужные ему
        # фреймворки лежат внутри него самого.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"

schemes:
  # Одна схема на всё: `xcodebuild build` собирает приложение, `xcodebuild test`
  # гоняет тесты. Отдельная схема для тестов разошлась бы с той, которой
  # пользуются человек и CI.
  WaiDictation:
    build:
      targets:
        WaiDictation: all
        WaiDictationTests: [test]
    test:
      config: Debug
      targets:
        - WaiDictationTests
    run:
      config: Debug
