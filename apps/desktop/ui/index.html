<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenRamble</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 2rem; line-height: 1.5; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0.5rem 0; max-width: 40rem; }
      .muted { opacity: 0.7; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>OpenRamble</h1>
    <p>Hold the dictation key, speak, and release it. The text appears in whatever you were typing in.</p>
    <p class="muted">Recognition runs on this machine. Nothing you say leaves it.</p>
  </body>
</html>
