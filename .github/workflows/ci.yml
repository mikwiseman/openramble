name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты пакетов
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Версия Swift
        run: swift --version

      # Предупреждения в этом проекте — ошибки: строгая конкурентность Swift 6
      # ловит здесь ровно те гонки, которые в звуке проявляются раз в сто
      # запусков и не воспроизводятся. Тесты собираются тем же гейтом: три
      # нарушения изоляции прятались именно в них, а тест, читающий не оттуда,
      # куда пишет, проходит зелёным и не проверяет ничего.
      - name: DictationCore
        run: |
          swift build --package-path Packages/DictationCore --build-tests -Xswiftc -warnings-as-errors
          swift test --package-path Packages/DictationCore

      - name: LocalASR
        run: |
          swift build --package-path Packages/LocalASR --build-tests -Xswiftc -warnings-as-errors
          swift test --package-path Packages/LocalASR

  app:
    name: Сборка приложения
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Проект собирается из project.yml и в репозитории не лежит.
      - name: xcodegen
        run: brew install xcodegen

      # Половина дефектов первого дня жила именно в цели приложения — в
      # пакетах их не видно, потому что она в них не входит.
      - name: Собрать
        run: |
          cd apps/macos
          xcodegen generate
          xcodebuild -project WaiDictation.xcodeproj -scheme WaiDictation \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

  network-surface:
    name: Сетевая поверхность
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Главное обещание продукта проверяется автоматически, а не на слово.
      - name: Проверить, что сеть только там, где разрешено
        run: ./scripts/check-network-surface.sh

  universal-build:
    name: Сборка под обе архитектуры
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Приложение распространяется universal-бинарём: локальное распознавание
      # доступно только на Apple Silicon, но собираться обязано и под Intel.
      - name: arm64
        run: swift build --package-path Packages/LocalASR --arch arm64

      - name: x86_64
        run: swift build --package-path Packages/LocalASR --arch x86_64
