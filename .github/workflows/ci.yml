name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-workspace:
    name: Rust workspace
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          workspaces: ". -> target"
      - run: ./scripts/prepare-tauri-macos.sh
      - name: Format, lint and test every shipping Rust target
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
      - name: Generated design tokens are current
        run: ./scripts/generate-tokens.py --check

  cross-platform-desktop:
    name: Cross-platform desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          workspaces: ". -> target"
      - name: Linux WebView and audio dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libxkbcommon-dev
      - name: Prepare native macOS framework
        if: matrix.os == 'macos-26'
        run: ./scripts/prepare-tauri-macos.sh
      - name: Build, test and lint the desktop shell
        shell: bash
        run: |
          cargo build --locked -p openramble-desktop
          cargo test --locked -p openramble-desktop
          cargo clippy --locked -p openramble-desktop --all-targets --all-features -- -D warnings

  tauri-macos:
    name: Tauri macOS
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          workspaces: ". -> target"
      - run: rustup target add x86_64-apple-darwin
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: ./scripts/prepare-tauri-macos.sh
      - name: Build universal Intel and Apple Silicon app
        run: |
          CARGO="$(rustup which cargo)" cargo tauri build \
            --runner "$PWD/scripts/cargo-locked.sh" \
            --config apps/desktop/src-tauri/tauri.conf.json \
            --target universal-apple-darwin --bundles app --no-sign
      - name: Verify both architectures and macOS floor
        run: |
          binary=target/universal-apple-darwin/release/bundle/macos/OpenRamble.app/Contents/MacOS/openramble-desktop
          test "$(lipo -archs "$binary")" = "x86_64 arm64"
          for arch in x86_64 arm64; do
            vtool -show-build -arch "$arch" "$binary" | grep -q 'minos 14.0'
          done

  release-topology:
    name: Release topology
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          workspaces: ". -> target"
      - run: rustup target add x86_64-apple-darwin
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Release policy and credential parsers
        run: |
          ./scripts/tests/test-release-policy.sh
          ./scripts/tests/test-notary-credentials.sh
          ./scripts/tests/test-bootstrap-release-secrets.sh
          ./scripts/tests/test-release-keychain.sh
      - name: Build exact unsigned production topology
        env:
          UNSIGNED_RELEASE_TOPOLOGY: "1"
        run: ./scripts/build-dmg.sh
      - name: Mount and smoke the exact DMG
        run: ./scripts/smoke-installed-artifact.sh artifacts/dmg/OpenRamble-*.dmg

  network-surface:
    name: Network surface
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          workspaces: ". -> target"
      - run: ./scripts/check-network-surface.sh
      - run: ./scripts/check-diagnostics-surface.sh

  feed:
    name: Update feed
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: xmllint --noout docs/appcast.xml
      - name: Appcast mutation is monotonic and idempotent
        run: |
          T=$(mktemp -d)
          cp docs/appcast.xml "$T/feed.xml"
          printf -- '- Check.\n' > "$T/notes.md"
          common=(APPCAST="$T/feed.xml" NOTES_PATH="$T/notes.md" MIN_OS=14.0
                  FEED_URL=https://example.invalid/appcast.xml
                  DMG_URL=https://example.invalid/a.dmg
                  LENGTH=1 SIGNATURE=signature APP_NAME=OpenRamble)
          env "${common[@]}" VERSION=9.9.9 BUILD=999 python3 scripts/update-appcast.py
          xmllint --noout "$T/feed.xml"
          if env "${common[@]}" VERSION=9.9.8 BUILD=998 python3 scripts/update-appcast.py; then exit 1; fi
          env "${common[@]}" VERSION=9.9.9 BUILD=999 python3 scripts/update-appcast.py
          test "$(grep -c '<title>9.9.9</title>' "$T/feed.xml")" = 1
