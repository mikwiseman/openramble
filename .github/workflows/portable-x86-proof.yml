name: Portable x86 proof

# Proof-only, on the proof branch, never on main. Builds the recognition
# runtime four ways on one hosted machine, counts instructions, times
# recognition, and then runs the builds on a stock machine and on an emulated
# processor that has AVX2 and no AVX-512.
#
#   shipped    what the packages are today: nothing set
#   fixed      the first commit alone: the fixed instruction set
#   portable   both commits: the fixed instruction set and no system BLAS
#   reference  the build the research measured: transcribe.cpp configured by
#              hand with the same switches, as engine-bench.yml does it
on:
  push:
    branches: ["claude/funny-benz-160e76-proof"]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIXED_ARGS: "-DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_BMI2=ON"
  PORTABLE_ARGS: "-DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_BMI2=ON -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF"
  TCPP_COMMIT: dacdba09be2b8d4dfe97a9d7464c51f462d5f622
  CLIP_URL: https://raw.githubusercontent.com/mikwiseman/transcribe.cpp/dacdba09be2b8d4dfe97a9d7464c51f462d5f622/samples/dots.wav
  Q4_URL: https://github.com/mikwiseman/openramble/releases/download/models-a1539be1/parakeet-ultra-Q4_K_M.gguf
  Q4_SHA256: c69b7a5f9071a7afd8a1818ef7ae542c386c4b01ed0cac380c19a99947646bf9
  # The file the Windows and Linux app ships (apps/desktop/src-tauri/model-manifest.json).
  Q8_URL: https://github.com/mikwiseman/openramble/releases/download/models-a1539be1/parakeet-ultra-Q8_0.gguf
  Q8_SHA256: 007a59761e9258779f189df396b50d12b83bb5b79e66df4b955c230d2f2a0a59
  # The run of desktop-release.yml on the branch with both commits.
  PACKAGES_RUN: "45056597412"

jobs:
  runtime:
    name: Runtime, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same images the packages are built on.
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Processor
        run: |
          {
            if command -v lscpu > /dev/null; then
              lscpu | grep -E 'Model name' | sed 's/  */ /g'
              echo "avx2: $(grep -cw avx2 /proc/cpuinfo), avx512f: $(grep -cw avx512f /proc/cpuinfo) (logical processors that report it)"
            else
              powershell -Command "(Get-CimInstance Win32_Processor).Name"
              pwsh -Command '"avx2: " + [System.Runtime.Intrinsics.X86.Avx2]::IsSupported + ", avx512f: " + [System.Runtime.Intrinsics.X86.Avx512F]::IsSupported'
            fi
          } > built-on.txt
          {
            echo "## ${{ matrix.name }}"
            echo '```'
            if [ "$RUNNER_OS" = Linux ]; then gcc --version | head -1; fi
            cat built-on.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build as shipped
        run: CARGO_TARGET_DIR=target-shipped cargo build --release -p ramble-engine --example clock --locked

      - name: Build with the fixed instruction set
        run: CARGO_TARGET_DIR=target-fixed TRANSCRIBE_CMAKE_ARGS="$FIXED_ARGS" cargo build --release -p ramble-engine --example clock --locked

      - name: Build with the fixed instruction set and no system BLAS
        run: CARGO_TARGET_DIR=target-portable TRANSCRIBE_CMAKE_ARGS="$PORTABLE_ARGS" cargo build --release -p ramble-engine --example clock --locked

      # Position-independent only because Rust links a program that way.
      - name: Build the measured AVX2 reference
        continue-on-error: true
        run: |
          here=$(pwd -W 2> /dev/null || pwd)
          git clone --quiet https://github.com/mikwiseman/transcribe.cpp tcpp
          git -C tcpp checkout --quiet "$TCPP_COMMIT"
          cmake -S tcpp -B tcpp/build -DCMAKE_BUILD_TYPE=Release \
            -DTRANSCRIBE_BUILD_TESTS=OFF -DTRANSCRIBE_BUILD_EXAMPLES=OFF \
            -DTRANSCRIBE_BUILD_SHARED=OFF -DTRANSCRIBE_METAL=OFF -DTRANSCRIBE_INSTALL=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON $PORTABLE_ARGS > tcpp-configure.log
          cmake --build tcpp/build --config Release --parallel 4 > tcpp-build.log 2>&1 || { tail -50 tcpp-build.log; exit 1; }
          cmake --install tcpp/build --config Release --prefix "$here/tcpp-prefix" > /dev/null
          TRANSCRIBE_DIR="$here/tcpp-prefix" CARGO_TARGET_DIR=target-reference cargo build --release -p ramble-engine --example clock --locked

      - name: How each build was configured
        run: |
          {
            echo "### Configuration"
            echo '```'
            for variant in shipped fixed portable; do
              out=$(find target-$variant/release/build -maxdepth 2 -type d -path '*/transcribe-cpp-sys-*/out' | head -1)
              echo "$variant:"
              grep -h "Adding CPU backend variant\|transcribe: .*BLAS" "${out%/out}/output" | sed 's/^/  /' | cut -c1-200
              grep -h '^GGML_NATIVE:\|^GGML_AVX2:\|^GGML_AVX512:\|^TRANSCRIBE_USE_SYSTEM_BLAS:' "$out/build/CMakeCache.txt" | tr -d '\r' | tr '\n' ' ' | sed 's/^/  /'
              echo
              manifest=$(find "$out" -path "$out/build" -prune -o -type f -name transcribe-link.json -print | head -1)
              grep -h 'system_libs\|library_paths\|link_flags' "$manifest" | tr -d '\r' | sed 's/^ */  /'
            done
            echo "reference:"
            (grep -h "Adding CPU backend variant\|transcribe: .*BLAS" tcpp-configure.log || true) | sed 's/^/  /' | cut -c1-200
            if [ "$RUNNER_OS" = Linux ]; then
              echo "--- shared libraries each program needs that have blas in the name"
              for variant in shipped fixed portable reference; do
                [ -f target-$variant/release/examples/clock ] || continue
                echo "$variant: $(objdump -p target-$variant/release/examples/clock | awk '/NEEDED/ { print $2 }' | (grep -i blas || true) | tr '\n' ' ')"
              done
              library=$(readlink -f /usr/lib/x86_64-linux-gnu/libblas.so.3 || true)
              echo "this image's libblas.so.3 is $library, from $(dpkg -S "$library" 2> /dev/null | cut -d: -f1)"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Instruction sets in the runtime's libraries, as shipped
        run: |
          {
            echo "### Runtime libraries, as shipped"
            echo '```'
            out=$(find target-shipped/release/build -maxdepth 2 -type d -path '*/transcribe-cpp-sys-*/out' | head -1)
            find "$out" -path "$out/build" -prune -o -type f \( -name '*.a' -o -name '*.lib' \) -print | sort | while read -r library; do
              objdump -d --no-show-raw-insn "$library" | awk -v name="${library#"$out"/}" '
                /^ *[0-9a-f]+:/ { total++ } /%zmm/ { wide++ } /%k[0-7]/ { mask++ } /%ymm/ { avx2++ }
                END { printf "%s: %d instructions, %d on AVX-512 registers, %d on mask registers, %d on 256-bit registers\n", name, total, wide, mask, avx2 }'
            done
            echo "--- the release check on this build"
            scripts/check-desktop-portability.sh target-shipped 2>&1 | tail -1 || echo "as shipped: the check FAILS"
            echo "--- the release check on the build with only the first commit"
            scripts/check-desktop-portability.sh target-fixed 2>&1 | tail -1 || echo "fixed: the check FAILS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Models and clip
        run: |
          mkdir -p q8 q4
          curl -L --fail --retry 3 -o q8/model.gguf "$Q8_URL"
          curl -L --fail --retry 3 -o q4/model.gguf "$Q4_URL"
          curl -L --fail --retry 3 -o dots.wav "$CLIP_URL"
          echo "$Q8_SHA256  q8/model.gguf" | sha256sum -c -
          echo "$Q4_SHA256  q4/model.gguf" | sha256sum -c -

      # One thread, as the app runs it on Windows and Linux. Two rounds,
      # alternating, so drift on a shared machine shows.
      - name: Speed
        run: |
          {
            echo "### Speed, one thread, best of three, milliseconds"
            echo '```'
            for round in 1 2; do
              for model in q8 q4; do
                for variant in shipped fixed portable reference; do
                  ls target-$variant/release/examples/clock* > /dev/null 2>&1 || { echo "round $round | $model | $variant | not built"; continue; }
                  target-$variant/release/examples/clock $model dots.wav 3 2 8 16 30 2> heard-$variant-$model.txt \
                    | sed "s/^/round $round | $model | $variant | /"
                done
              done
            done
            echo "--- words"
            for model in q8 q4; do
              same=yes
              for variant in shipped fixed reference; do
                cmp -s heard-$variant-$model.txt heard-portable-$model.txt || same="no ($variant differs)"
              done
              echo "$model: text identical in all four builds: $same"
            done
            head -2 heard-portable-q8.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the programs
        if: runner.os == 'Linux'
        run: |
          mkdir clocks
          for variant in shipped fixed portable; do
            cp target-$variant/release/examples/clock clocks/clock-$variant
          done
          cp heard-portable-q8.txt built-on.txt clocks/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: clocks
          path: clocks/*
          if-no-files-found: error

      - name: The release check passes on the build with both commits
        run: scripts/check-desktop-portability.sh target-portable | tee -a "$GITHUB_STEP_SUMMARY"

  # A stock Ubuntu 24.04 image, which has no BLAS library, and then QEMU's
  # emulated processor, which has AVX2, FMA, F16C and BMI2 and no AVX-512, so
  # an AVX-512 instruction stops a program exactly as it does on a real
  # computer without it. 24.04 because 22.04's QEMU cannot emulate AVX at all.
  elsewhere:
    name: Recognition on another computer
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      # The first proof run built its programs on a Xeon Platinum 8573C, which
      # has AVX-512: its "shipped" program is what a release job on such a
      # machine produces, as the published 0.37.0 Linux package was.
      OLDER_RUN: "45049794830"
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clocks

      - name: Model and clip
        run: |
          mkdir q8
          curl -L --fail --retry 3 -o q8/model.gguf "$Q8_URL"
          curl -L --fail --retry 3 -o dots.wav "$CLIP_URL"
          echo "$Q8_SHA256  q8/model.gguf" | sha256sum -c -
          chmod +x clock-shipped clock-fixed clock-portable
          gh run download "$OLDER_RUN" --repo "$GITHUB_REPOSITORY" --name clocks --dir older
          chmod +x older/clock-shipped
          cat > features.c <<'EOF'
          #include <stdio.h>
          int main(void) {
            __builtin_cpu_init();
            printf("avx2 %d, fma %d, bmi2 %d, avx512f %d\n",
                   __builtin_cpu_supports("avx2") != 0, __builtin_cpu_supports("fma") != 0,
                   __builtin_cpu_supports("bmi2") != 0, __builtin_cpu_supports("avx512f") != 0);
            return 0;
          }
          EOF
          gcc -O1 -o features features.c

      - name: On this machine as it comes, then emulated
        run: |
          try() {
            set +e
            timeout 25m "$@" > out.txt 2> err.txt
            code=$?
            set -e
            echo "  exit status $code"
            (grep -h 'error while loading\|uncaught target signal\|Illegal' err.txt || true) | sed 's/^/  /' | cut -c1-200
            (grep -h '^ *2 |' out.txt || true) | sed 's/^/  seconds, milliseconds, characters: /'
            (grep -h '^heard 2 s' err.txt || true) | sed 's/^/  /'
          }
          {
            echo "## Another computer"
            echo '```'
            echo "the programs were built on: $(tr '\n' ' ' < built-on.txt)"
            echo "this machine: $(lscpu | grep 'Model name' | sed 's/.*: *//'); $(./features)"
            echo "exit status 127 is a missing library, 132 an illegal instruction"
            echo "--- no BLAS library installed (the image as it comes)"
            for variant in shipped fixed portable; do
              echo "$variant:"
              try ./clock-$variant q8 dots.wav 1 2
              if [ "$variant" = portable ]; then echo "$code" > code-portable-stock.txt; cp err.txt err-portable-stock.txt; fi
            done
            sudo apt-get update > /dev/null
            sudo apt-get install -y libblas3 qemu-user > /dev/null
            echo "--- after installing libblas3"
            for variant in shipped fixed; do
              echo "$variant:"
              try ./clock-$variant q8 dots.wav 1 2
            done
            echo "shipped, as built on a machine with AVX-512 (run $OLDER_RUN):"
            try older/clock-shipped q8 dots.wav 1 2
            echo "--- on an emulated processor: $(qemu-x86_64 --version | head -1)"
            echo "emulated: $(qemu-x86_64 -cpu max ./features)"
            echo "shipped, as built on a machine with AVX-512 (run $OLDER_RUN):"
            try qemu-x86_64 -cpu max older/clock-shipped q8 dots.wav 1 2
            echo "$code" > code-older-emulated.txt
            echo "portable:"
            try qemu-x86_64 -cpu max ./clock-portable q8 dots.wav 1 2
            echo "$code" > code-portable-emulated.txt; cp err.txt err-portable-emulated.txt
            echo "--- the build machine heard"
            head -1 heard-portable-q8.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(cat code-portable-stock.txt)" = 0 ]
          [ "$(cat code-portable-emulated.txt)" = 0 ]
          [ "$(cat code-older-emulated.txt)" = 132 ]
          cmp <(grep '^heard 2 s' err-portable-stock.txt) <(head -1 heard-portable-q8.txt)
          cmp <(grep '^heard 2 s' err-portable-emulated.txt) <(head -1 heard-portable-q8.txt)

      # The research built its reference on this image, whose compiler is two
      # major versions newer than the one the packages are built with. Same
      # source, same switches, same machine: what the compiler alone changes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src

      - name: The compiler alone
        shell: bash
        run: |
          here=$PWD
          (cd src && CARGO_TARGET_DIR="$here/target-newer" TRANSCRIBE_CMAKE_ARGS="$PORTABLE_ARGS" cargo build --release -p ramble-engine --example clock --locked)
          mkdir q4
          curl -L --fail --retry 3 -o q4/model.gguf "$Q4_URL"
          echo "$Q4_SHA256  q4/model.gguf" | sha256sum -c -
          {
            echo "### The same build by two compilers, on this machine, one thread, milliseconds"
            echo '```'
            echo "this image: $(gcc --version | head -1)"
            for round in 1 2; do
              for model in q8 q4; do
                ./clock-portable $model dots.wav 3 2 8 16 30 2> /dev/null | sed "s/^/round $round | $model | built on 22.04 | /"
                target-newer/release/examples/clock $model dots.wav 3 2 8 16 30 2> /dev/null | sed "s/^/round $round | $model | built on 24.04 | /"
              done
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The packages themselves: the published 0.37.0 ones, and the ones a run of
  # desktop-release.yml built on the branch with the change.
  packages:
    name: Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect
        shell: bash
        run: |
          set -u
          inspect() {
            label=$1; deb=$2; setup=$3
            rm -rf deb exe; mkdir deb exe
            (cd deb && ar x "$deb" && mkdir root && tar -xf data.tar.* -C root && tar -xf control.tar.*)
            (cd exe && 7z x -y "$setup" > /dev/null || true)
            echo "## $label"
            echo '```'
            echo "the .deb asks for: $(grep '^Depends' deb/control | cut -d: -f2-)"
            for f in $(find deb/root -type f -size +1M) $(find exe -type f \( -name '*.exe' -o -name '*.dll' \) -size +1M); do
              objdump -f "$f" > /dev/null 2>&1 || continue
              objdump -d --no-show-raw-insn "$f" > listing.txt 2> /dev/null || true
              total=$(grep -c '^ *[0-9a-f]*:' listing.txt || true)
              zmm=$(grep -c '%zmm' listing.txt || true)
              k=$(grep -cE '%k[1-7]' listing.txt || true)
              ymm=$(grep -c '%ymm' listing.txt || true)
              fma=$(grep -cE 'vfn?m(add|sub)[0-9]+[ps][sd]' listing.txt || true)
              echo "$f: $total instructions; AVX-512 registers $zmm, mask registers $k; 256-bit registers $ymm; fused multiply-adds $fma"
              echo "  shared libraries it needs with blas in the name: $(objdump -p "$f" | awk '/NEEDED|DLL Name/ { print $NF }' | (grep -i blas || true) | tr '\n' ' ')"
              # Where they are. The Linux executable keeps its function names.
              rm -f other.txt
              awk '
                BEGIN { split("", by) }
                /^[0-9a-f]+ <.*>:$/ { fn = $2; next }
                /%zmm|%k[0-7]/ {
                  if (fn ~ /aws_lc_|iv_len_12_init_IV/) tls++
                  else if (fn ~ /25519.*gtable/) table++
                  else { other++; by[fn]++ }
                }
                END {
                  printf "  naming either kind of register: %d\n", tls + table + other
                  printf "  in the TLS library (aws-lc, chosen at run time): %d\n", tls
                  printf "  constant tables read as code: %d\n", table
                  printf "  everything else: %d, in %d functions\n", other, length(by)
                  for (f in by) printf "%d %s\n", by[f], f > "other.txt"
                }' listing.txt
              if [ -f other.txt ]; then sort -rn other.txt | head -6 | sed 's/^/    /'; fi
              # The Windows executable has no names. Show which instructions they are.
              echo "  mask-register instructions by name:"
              (grep -E '%k[0-7]' listing.txt || true) | awk '{ print $2 }' | sort | uniq -c | sort -rn | head -8 | sed 's/^/   /'
            done
            echo '```'
          }
          base="https://github.com/mikwiseman/openramble/releases/download/desktop-v0.37.0"
          mkdir before
          curl -L --fail --retry 3 -o before/pkg.deb "$base/OpenRamble_0.37.0_amd64.deb"
          curl -L --fail --retry 3 -o before/setup.exe "$base/OpenRamble_0.37.0_x64-setup.exe"
          inspect "Published desktop-v0.37.0" "$PWD/before/pkg.deb" "$PWD/before/setup.exe" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$PACKAGES_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null
          gh run download "$PACKAGES_RUN" --repo "$GITHUB_REPOSITORY" --dir after
          inspect "Built with the change (run $PACKAGES_RUN)" "$(ls "$PWD"/after/openramble-linux/*.deb)" "$(ls "$PWD"/after/openramble-windows/*-setup.exe)" | tee -a "$GITHUB_STEP_SUMMARY"
