name: Desktop packages
run-name: ${{ github.event_name == 'repository_dispatch' && format('Wolf desktop package {0}', github.event.client_payload.request) || format('Desktop packages · {0}', github.ref_name) }}

# Installers for Windows and Linux. Run on demand and on a tag, because a
# 700 MB toolchain build on three runners is not something to do on every push.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [wolf-desktop-package]
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  # Each platform is built and published by itself, in desktop-package.yml.
  # Windows does not wait for Linux, and a platform whose build fails holds
  # back only its own packages.
  platform:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x86_64)
            artifact: openramble-windows
          - os: ubuntu-22.04
            label: Linux (x86_64)
            artifact: openramble-linux
    uses: ./.github/workflows/desktop-package.yml
    with:
      os: ${{ matrix.os }}
      artifact: ${{ github.event_name == 'repository_dispatch' && format('{0}-{1}', matrix.artifact, github.event.client_payload.sha) || matrix.artifact }}
      revision: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
    # Only the publishing job inside asks for this much; the build stays
    # read-only.
    permissions:
      contents: write
