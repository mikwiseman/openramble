name: Desktop packages

# Installers for Windows and Linux. Run on demand and on a tag, because a
# 700 MB toolchain build on three runners is not something to do on every push.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  # Each platform is built and published by itself, in desktop-package.yml.
  # Windows does not wait for Linux, and a platform whose build fails holds
  # back only its own packages.
  platform:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x86_64)
            artifact: openramble-windows
          - os: ubuntu-22.04
            label: Linux (x86_64)
            artifact: openramble-linux
    uses: ./.github/workflows/desktop-package.yml
    with:
      os: ${{ matrix.os }}
      artifact: ${{ matrix.artifact }}
    # Only the publishing job inside asks for this much; the build stays
    # read-only.
    permissions:
      contents: write
