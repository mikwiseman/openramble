name: Engine bench

# Builds the engine on every platform it must run on and times it against
# transcribe.cpp, the runtime the app ships today, on the same hosted machine.
# The hosted runners stand in for slow computers: a few cores, no accelerator.
# Runs on demand and on pushes to the engine's own branches, never on main.
on:
  workflow_dispatch:
  push:
    branches: ["claude/own-engine-*"]
    paths: ["engine/**", ".github/workflows/engine-bench.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TCPP_COMMIT: dacdba09be2b8d4dfe97a9d7464c51f462d5f622
  MODEL_URL: https://github.com/mikwiseman/openramble/releases/download/models-a1539be1/parakeet-ultra-Q4_K_M.gguf
  MODEL_SHA256: c69b7a5f9071a7afd8a1818ef7ae542c386c4b01ed0cac380c19a99947646bf9

jobs:
  bench:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # transcribe.cpp is configured the way each shipped build configures
          # it: the Rust crate's defaults on Linux and Windows, and the fixed
          # 2019 instruction floor it uses for the Intel Mac slice.
          - name: Linux x86_64
            os: ubuntu-latest
            tcpp_args: ""
          - name: Windows x86_64
            os: windows-latest
            tcpp_args: ""
          - name: Linux arm64
            os: ubuntu-24.04-arm
            tcpp_args: ""
          # The oldest Apple silicon a hosted runner has. The app uses Metal
          # there; this shows what the processor alone does.
          - name: Apple silicon (M1 runner)
            os: macos-15
            tcpp_args: "-DGGML_NATIVE=OFF"
          - name: Intel Mac (as shipped)
            os: macos-15-intel
            tcpp_args: "-DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF"
          - name: Intel Mac (AVX2 build)
            os: macos-15-intel
            tcpp_args: "-DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_BMI2=ON"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Processor
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo '```'
            if command -v lscpu > /dev/null; then
              lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|MHz|Flags|Features|L2|L3' | cut -c1-600
            elif [ "$(uname)" = Darwin ]; then
              sysctl -n machdep.cpu.brand_string hw.ncpu hw.physicalcpu
              # Intel only; Apple silicon has no such keys.
              (sysctl -n machdep.cpu.features machdep.cpu.leaf7_features 2> /dev/null || true) | cut -c1-600
            else
              powershell -Command "Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Model
        run: |
          curl -L --fail --retry 3 -o model.gguf "$MODEL_URL"
          if command -v sha256sum > /dev/null; then
            echo "$MODEL_SHA256  model.gguf" | sha256sum -c -
          else
            echo "$MODEL_SHA256  model.gguf" | shasum -a 256 -c -
          fi

      - name: Build transcribe.cpp
        run: |
          git clone --quiet https://github.com/mikwiseman/transcribe.cpp tcpp
          git -C tcpp checkout --quiet "$TCPP_COMMIT"
          cmake -S tcpp -B tcpp/build -DCMAKE_BUILD_TYPE=Release \
            -DTRANSCRIBE_BUILD_TESTS=OFF -DTRANSCRIBE_BUILD_EXAMPLES=OFF \
            -DTRANSCRIBE_BUILD_SHARED=OFF -DTRANSCRIBE_METAL=OFF -DTRANSCRIBE_INSTALL=ON \
            ${{ matrix.tcpp_args }} > tcpp-configure.log
          grep -iE 'native|march|arch:|avx|sse|x86|arm' tcpp-configure.log | head -40 || true
          cmake --build tcpp/build --config Release --parallel 4 > tcpp-build.log 2>&1 || { tail -50 tcpp-build.log; exit 1; }
          cmake --install tcpp/build --config Release --prefix "$PWD/tcpp-prefix" > /dev/null

      - name: Build the engine
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DORE_TCPP_PREFIX="$PWD/tcpp-prefix"
          cmake --build engine/build --config Release --parallel 4

      # What the library asks of the system: nothing that reaches a network.
      - name: Symbols
        if: runner.os != 'Windows'
        run: |
          lib=$(find engine/build -name 'libore.a' | head -1)
          engine/scripts/check-symbols.sh "$lib" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kernels
        run: |
          bin=engine/build; [ -d engine/build/Release ] && bin=engine/build/Release
          {
            echo "### Kernels, one thread"
            echo '```'
            "$bin/kbench" model.gguf 100 7
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The same clips through both runtimes: the words must agree, and the
      # engine's own answer must not depend on which kernel table computed it.
      - name: Same words
        run: |
          bin=engine/build; [ -d engine/build/Release ] && bin=engine/build/Release
          printf '%s\n' tcpp/samples/fleurs-en.wav tcpp/samples/fleurs-ru.wav tcpp/samples/fleurs-de.wav tcpp/samples/dots.wav > clips.txt
          "$bin/ore-cli" dump model.gguf clips.txt 4 > ore.tsv
          "$bin/tcpp-probe" dump model.gguf clips.txt 4 > tcpp.tsv
          echo tcpp/samples/fleurs-ru.wav > one.txt
          "$bin/ore-cli" dump model.gguf one.txt 4 > ore-best.tsv
          ORE_KERNELS=generic "$bin/ore-cli" dump model.gguf one.txt 4 > ore-generic.tsv
          ORE_KERNELS=sse "$bin/ore-cli" dump model.gguf clips.txt 4 > ore-sse.tsv 2> /dev/null || rm -f ore-sse.tsv
          {
            echo "### Same words"
            echo '```'
            cut -f1,2 ore.tsv
            echo "--- transcribe.cpp ---"
            cut -f1,2 tcpp.tsv
            if cmp -s <(cut -f1,2 ore.tsv) <(cut -f1,2 tcpp.tsv); then echo "text: identical"; else echo "text: DIFFERENT"; fi
            if cmp -s <(cut -f1-3 ore.tsv) <(cut -f1-3 tcpp.tsv); then echo "tokens and times: identical"; else echo "tokens and times: DIFFERENT"; fi
            if cmp -s ore-best.tsv ore-generic.tsv; then echo "kernel tables: identical output"; else echo "kernel tables: DIFFERENT output"; fi
            if [ -f ore-sse.tsv ]; then
              if cmp -s <(cut -f1,2 ore.tsv) <(cut -f1,2 ore-sse.tsv); then echo "sse kernels: identical text"; else echo "sse kernels: DIFFERENT text"; fi
            fi
            echo "engine output checksum (compare across machines):"
            if command -v sha256sum > /dev/null; then sha256sum ore.tsv | cut -c1-16; else shasum -a 256 ore.tsv | cut -c1-16; fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cmp -s <(cut -f1,2 ore.tsv) <(cut -f1,2 tcpp.tsv)
          cmp -s ore-best.tsv ore-generic.tsv

      - name: Speed by clip length
        run: |
          bin=engine/build; [ -d engine/build/Release ] && bin=engine/build/Release
          {
            echo "### Speed by clip length, CPU, milliseconds"
            echo '```'
            for threads in 1 2 4; do
              "$bin/ore-cli" time model.gguf tcpp/samples/dots.wav "$threads" 3 2 4 8 16 30
              "$bin/tcpp-probe" time model.gguf tcpp/samples/dots.wav "$threads" 3 2 4 8 16 30
            done
            # The kernels for x86 processors without AVX2, on this processor.
            for threads in 1 4; do
              ORE_KERNELS=sse "$bin/ore-cli" time model.gguf tcpp/samples/dots.wav "$threads" 3 8 30 || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # transcribe.cpp is built for whatever processor the build machine has
  # (ggml's GGML_NATIVE default), so a package can end up needing instructions
  # a buyer's computer lacks. This looks at the packages that were actually
  # published and counts the instructions that need AVX-512 or AVX2.
  shipped:
    name: Published packages, instruction sets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE: desktop-v0.37.0
    steps:
      - name: Inspect
        run: |
          set -u
          base="https://github.com/mikwiseman/openramble/releases/download/$RELEASE"
          mkdir deb exe
          curl -L --fail --retry 3 -o deb/pkg.deb "$base/OpenRamble_0.37.0_amd64.deb"
          curl -L --fail --retry 3 -o exe/setup.exe "$base/OpenRamble_0.37.0_x64-setup.exe"
          (cd deb && ar x pkg.deb && mkdir root && tar -xf data.tar.* -C root)
          (cd exe && 7z x -y setup.exe > /dev/null || true)
          {
            echo "## Published packages ($RELEASE)"
            echo '```'
            for f in $(find deb/root -type f -size +1M) $(find exe -type f \( -name '*.exe' -o -name '*.dll' \) -size +1M ! -name setup.exe); do
              if objdump -f "$f" > /dev/null 2>&1; then
                dis=$(objdump -d --no-show-raw-insn "$f" 2> /dev/null || true)
                total=$(printf '%s\n' "$dis" | grep -c '^ *[0-9a-f]*:' || true)
                zmm=$(printf '%s\n' "$dis" | grep -c '%zmm' || true)
                k=$(printf '%s\n' "$dis" | grep -cE '%k[1-7]' || true)
                ymm=$(printf '%s\n' "$dis" | grep -c '%ymm' || true)
                fma=$(printf '%s\n' "$dis" | grep -cE 'vfn?m(add|sub)[0-9]+[ps][sd]' || true)
                echo "$f: $total instructions; AVX-512 registers $zmm, mask registers $k; 256-bit registers $ymm; fused multiply-adds $fma"
              fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
