name: Desktop package

# One platform's packages: built, and on a tag published as soon as that
# build is done. desktop-release.yml calls this once for each platform.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      revision:
        description: Merged revision for a Wolf QA request
        type: string
        default: ''
      artifact:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: ${{ github.event_name == 'repository_dispatch' && '0' || '1' }}
          persist-credentials: false
      - name: Select the requested merged revision
        if: github.event_name == 'repository_dispatch'
        shell: bash
        env:
          SOURCE: ${{ inputs.revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE" "refs/remotes/origin/$DEFAULT_BRANCH"
          git checkout --detach "$SOURCE"
          test "$(git rev-parse HEAD)" = "$SOURCE"

      # 22.04 rather than latest: the AppImage and .deb link against whatever
      # glibc built them, so building on the newest runner would produce
      # packages that refuse to start on the distributions people actually run.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libxkbcommon-dev

      - name: Install the Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bundle
        shell: bash
        run: cargo tauri build --config apps/desktop/src-tauri/tauri.conf.json

      # Nothing of the build machine may go into the packages: 0.37.0 for
      # Linux needed AVX-512, which most computers lack. The engine chooses
      # its kernels on the computer it runs on, and this reads what was
      # compiled to make sure nothing else needs a newer processor.
      - name: The engine must not need the build machine
        shell: bash
        run: scripts/check-desktop-portability.sh

      - name: Collect the packages
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -type f \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" \
               -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact }}
          path: dist/*
          if-no-files-found: error

  # Building the packages is not releasing them. Without this job the workflow
  # went green while no release existed for anyone to download — the same way a
  # macOS version was once built, version-bumped, and never shipped. A tag
  # means a release; that is what this makes true.
  #
  # It is a job of its own so that the build, which compiles code from
  # hundreds of crates, never holds a token that can write to the repository.
  publish:
    name: Publish
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One platform at a time, so that the first to finish creates the release
    # and the next finds it there.
    concurrency:
      group: desktop-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact }}
          path: dist

      # The tag and the filenames must agree. They did not once: packages named
      # 0.1.0 were published under desktop-v0.2.0, so anyone downloading the
      # release got files claiming to be the version it replaced.
      - name: The packages must carry the tag's version
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          ls -la dist
          # Publishing nothing is worse than failing: the release would look
          # finished and this platform would download nothing.
          [ "$(ls -A dist)" ] || { echo "no packages to publish" >&2; exit 1; }
          for file in dist/*; do
            case "$(basename "$file")" in
              *"$VERSION"*) ;;
              *) echo "$(basename "$file") does not carry version $VERSION" >&2; exit 1 ;;
            esac
          done
          echo "every package carries $VERSION"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Another platform got here first. Replacing is for a second
            # attempt of this same job, whose files may already be there.
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Never the repository's latest release: the README sends Mac
            # downloads to releases/latest, and that page must keep the DMG.
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenRamble for Windows and Linux $VERSION" \
              --notes "Windows and Linux packages built from ${GITHUB_SHA}." \
              --latest=false
          fi
