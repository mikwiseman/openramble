[package]
name = "ramble-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ramble-audio = { path = "../ramble-audio" }

# Default features are off so each platform states its accelerator explicitly.
# `metal` is the crate's default and would silently follow us onto Windows.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.2", default-features = false, features = ["metal"] }

# No accelerator feature on Windows and Linux yet, deliberately.
#
# The crate's `vulkan` feature needs the Vulkan SDK present at *build* time and
# fails the build without it — so requiring it would mean the app could only be
# compiled on machines that have the SDK, and could not be built at all on a
# stock CI runner. The CPU path works everywhere and is what a first release
# should be judged on. Turning Vulkan on is its own piece of work: the SDK in
# the build image, and a runtime report saying which one a person actually got.
[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.2", default-features = false }

[dev-dependencies]
ramble-model = { path = "../ramble-model" }
tempfile = "3"

[lints]
workspace = true
