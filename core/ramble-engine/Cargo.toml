[package]
name = "ramble-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ramble-audio = { path = "../ramble-audio" }

# The recognition engine is the C library in `engine/`, compiled into this
# crate by build.rs. It has no dependencies of its own and nothing here is
# fetched to build it.
[build-dependencies]
cc = "1"

[dev-dependencies]
ramble-model = { path = "../ramble-model" }
tempfile = "3"

[lints]
workspace = true
