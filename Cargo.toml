# OpenRamble Rust workspace.
#
# The shipping desktop app is Tauri on macOS, Windows, and Linux. The retired
# Swift implementation remains in Packages/ and apps/macos/ as migration
# evidence, but release builds come entirely from this workspace.
[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "core/ramble-audio",
  "core/ramble-core",
  "core/ramble-engine",
  "core/ramble-ffi",
  "core/ramble-history",
  "core/ramble-model",
  "core/ramble-text",
]

[workspace.package]
version = "0.24.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mikwiseman/openramble"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
