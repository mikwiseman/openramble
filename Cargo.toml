# OpenRamble Rust workspace.
#
# The macOS app (Packages/, apps/macos/) is Swift and is untouched by this
# manifest — SwiftPM and Cargo ignore each other. This workspace is the shared
# core that Windows and Linux run on today and that the macOS app migrates onto
# module by module, so that a behaviour improvement is written once and reaches
# every platform.
[workspace]
resolver = "2"
members = ["core/ramble-core", "core/ramble-text"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mikwiseman/openramble"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
