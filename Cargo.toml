# OpenRamble Rust workspace.
#
# The macOS app (Packages/, apps/macos/) is Swift and is untouched by this
# manifest — SwiftPM and Cargo ignore each other. This workspace is the shared
# core that Windows and Linux run on today and that the macOS app migrates onto
# module by module, so that a behaviour improvement is written once and reaches
# every platform.
[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "core/ramble-audio",
  "core/ramble-core",
  "core/ramble-engine",
  "core/ramble-ffi",
  "core/ramble-history",
  "core/ramble-model",
  "core/ramble-text",
]

[workspace.package]
version = "0.23.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mikwiseman/openramble"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Xcode 27's `strip` writes proc-macro dylibs that dyld refuses to load
# ("mis-aligned LINKEDIT string pool"), so a release build cannot load
# serde_derive and fails before compiling anything of ours. Proc macros and
# build scripts run on the build machine and are never shipped; only they
# skip stripping. Shipped artifacts are stripped exactly as before.
[profile.release.build-override]
strip = false
